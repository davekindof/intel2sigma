id: zeek_smb_files
label: An SMB file operation was observed by Zeek
description: Use for Zeek smb_files.log rules — file reads and writes over SMB seen on the wire, which catches lateral movement and remote payload staging without needing an agent on either host.
category_group: network
logsource:
  product: zeek
  service: smb_files
platforms:
- id: zeek
  product: zeek
  tier: primary
synonyms:
- Zeek SMB
- smb_files.log
- SMB file transfer
- lateral movement
- admin share access
fields:
- name: name
  label: File name
  type: string
  default_modifier: exact
  allowed_modifiers:
  - exact
  - contains
  - startswith
  - endswith
  - re
  note: Name of the file accessed over the share. Suffix matching catches payload and tooling extensions.
  example: psexesvc.exe
- name: path
  label: Share path
  type: string
  default_modifier: exact
  allowed_modifiers:
  - exact
  - contains
  - startswith
  - endswith
  - re
  note: UNC share the operation targeted. Admin shares such as ADMIN$ and C$ are the lateral-movement signal.
  example: \\host\ADMIN$
