id: windows_bits_client
label: A BITS transfer job was logged
description: Use for Background Intelligent Transfer Service rules — BITS is a living-off-the-land download and exfiltration channel, since the transfer is performed by a trusted Windows service rather than the calling process.
category_group: os_event_log
logsource:
  product: windows
  service: bits-client
platforms:
- id: windows
  product: windows
  tier: primary
synonyms:
- BITS
- BITS client
- background transfer
- bitsadmin
- LOLBin download
fields:
- name: EventID
  label: Event ID
  type: int
  default_modifier: exact
  allowed_modifiers:
  - exact
  - gt
  - gte
  - lt
  - lte
  note: Microsoft-Windows-Bits-Client/Operational event. 59 and 60 mark transfer start and completion.
  example: '59'
- name: RemoteName
  label: Remote URL
  type: string
  default_modifier: contains
  allowed_modifiers:
  - contains
  - startswith
  - endswith
  - exact
  - re
  note: The remote URL the job transfers to or from — the field that reveals the actual destination.
  example: http://203.0.113.10/payload.dat
- name: LocalName
  label: Local file path
  type: string
  default_modifier: contains
  allowed_modifiers:
  - contains
  - startswith
  - endswith
  - exact
  - re
  note: Where the transferred file lands on disk.
  example: C:\Users\Public\payload.dat
- name: processPath
  label: Requesting process path
  type: string
  default_modifier: endswith
  allowed_modifiers:
  - endswith
  - contains
  - startswith
  - exact
  - re
  note: Process that created the BITS job. bitsadmin.exe and powershell.exe are the common abuse paths.
  example: C:\Windows\System32\bitsadmin.exe
