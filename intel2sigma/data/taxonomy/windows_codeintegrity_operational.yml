id: windows_codeintegrity_operational
label: A Code Integrity check was logged
description: Use for Windows Code Integrity rules — unsigned or improperly signed drivers and images blocked or audited by CI policy, including vulnerable-driver load attempts.
category_group: os_event_log
logsource:
  product: windows
  service: codeintegrity-operational
platforms:
- id: windows
  product: windows
  tier: primary
synonyms:
- Code Integrity
- CodeIntegrity operational
- driver signing
- WDAC
- unsigned driver
fields:
- name: EventID
  label: Event ID
  type: int
  default_modifier: exact
  allowed_modifiers:
