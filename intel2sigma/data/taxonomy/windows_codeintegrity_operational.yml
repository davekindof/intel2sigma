- name: FileNameBuffer
  label: Image file path
  type: string
  default_modifier: endswith
  allowed_modifiers:
  - endswith
  - contains
  - startswith
  - exact
  - re
  note: Path of the image that failed the integrity check — typically the driver or DLL being loaded.
  example: \Device\HarddiskVolume3\Windows\Temp\evil.sys
- name: ProcessNameBuffer
  label: Loading process path
  type: string
  default_modifier: endswith
  allowed_modifiers:
  - endswith
  - contains
  - startswith
  - exact
  - re
