# Pipeline matrix.
#
# Shape and resolution algorithm specified in docs/pipeline-matrix.md.
#
# Pipeline short names (microsoft_xdr, splunk_windows, sysmon, ecs_windows,
# crowdstrike_fdr, microsoft_365_defender) resolve through pySigma's
# InstalledSigmaPlugins registry. Backend names (kusto, splunk, lucene,
# log_scale) are pySigma's own backend identifiers from the same registry.
# Our intel2sigma backend ids (kusto_sentinel, kusto_mde, splunk,
# elasticsearch, crowdstrike) are the user-facing wrappers.

# Telemetry a backend's target schema does not contain at all.
#
# When conversion fails for a logsource listed here, the user is told the
# detection cannot be expressed for that backend — a property of the
# platform, not a gap anyone will close. Everything NOT listed falls back
# to the "mapping gap we can close" message.
#
# That default is deliberate. The two ways of being wrong are not equally
# costly: telling someone a rule is impossible when it is merely unmapped
# makes them abandon a detection we could support, whereas telling them
# something is a gap when it is really impossible only leaves a stale
# to-do. So add a product here only when you are confident the platform
# has no equivalent telemetry, and leave it out when unsure.
#
# The list is anchored on kusto_sentinel and aliased into kusto_mde —
# both target the Defender XDR schema and share it exactly.

backends:
    kusto_sentinel:
        sigma_backend: kusto
        format: default
        baseline_pipelines: [microsoft_xdr]
        label: "Microsoft Sentinel (KQL)"
        # SaaS and cloud platforms are deliberately ABSENT from this list,
        # even though none of them convert today. Microsoft ships
        # first-party connectors that land their telemetry in Defender XDR
        # advanced-hunting tables: Okta via Defender for Identity
        # (learn.microsoft.com/defender-for-identity/okta-integration,
        # preview as of 2026-06) and via Defender for Cloud Apps, and
        # AWS / GCP / GitHub / Bitbucket / OneLogin via Defender for Cloud
        # Apps into CloudAppEvents. The data can reach the schema, so the
        # honest answer is "unmapped", not "impossible" — and that answer
        # keeps changing as Microsoft ships connectors, which is precisely
        # why this list holds only sources with no ingestion path at all.
        unsupported_products: &defender_xdr_unsupported
            zeek: "Zeek network-sensor telemetry"
            cisco: "Cisco appliance syslog"
            fortigate: "FortiGate event logs"
            juniper: "Juniper device logs"
            huawei: "Huawei device logs"
            jvm: "JVM application logs"
            opencanary: "OpenCanary honeypot events"
            rpc_firewall: "RPC Firewall events"
        # {label} and {telemetry} are substituted at render time. The copy
        # is scoped to *this backend's* schema rather than to Microsoft's
        # products as a whole: appliance syslog and self-hosted sensor
        # telemetry can reach Sentinel-native tables via CEF/syslog
        # connectors, but not the Defender XDR tables this backend queries.
        unsupported_template: &defender_xdr_unsupported_template >-
            {label} queries the Microsoft Defender XDR advanced-hunting
            schema, which has no tables for {telemetry}. This detection
            cannot be expressed against that schema. The Splunk, Elastic
            and CrowdStrike tabs pass these field names through and will
            usually convert it.
        # Sysmon-only Sigma categories that pySigma's microsoft_xdr
        # pipeline doesn't have a default table mapping for. Each entry
        # injects ``query_table`` into the pipeline state at priority 5
        # (runs before the upstream's priority-10 SetQueryTableState),
        # which short-circuits the "Unable to determine table name"
        # error. ``filter`` is optional — used to disambiguate a slice
        # of a multi-purpose table; left empty when no clean ActionType
        # value applies (or when we haven't verified one yet).
        category_overrides:
            create_remote_thread:  { table: DeviceEvents }
            pipe_created:          { table: DeviceEvents }
            raw_access_thread:     { table: DeviceEvents }
            wmi_event:             { table: DeviceEvents }
            driver_load:           { table: DeviceEvents }
            process_access:        { table: DeviceEvents }
            dns_query:             { table: DeviceNetworkEvents }
            ps_script:             { table: DeviceEvents }
            ps_module:             { table: DeviceEvents }

    kusto_mde:
        sigma_backend: kusto
        format: default
        baseline_pipelines: [microsoft_365_defender]
        label: "Microsoft Defender for Endpoint (KQL)"
        unsupported_products: *defender_xdr_unsupported
        unsupported_template: *defender_xdr_unsupported_template
        # Mirrors kusto_sentinel — both backends use the same
        # microsoft_xdr / microsoft_365_defender pipelines under the
        # hood and share the same coverage gaps. Reviewed quarterly per
        # docs/recalibration.md; entries removed if pySigma upstream
        # adds them.
        category_overrides:
            create_remote_thread:  { table: DeviceEvents }
            pipe_created:          { table: DeviceEvents }
            raw_access_thread:     { table: DeviceEvents }
            wmi_event:             { table: DeviceEvents }
            driver_load:           { table: DeviceEvents }
            process_access:        { table: DeviceEvents }
            dns_query:             { table: DeviceNetworkEvents }
            ps_script:             { table: DeviceEvents }
            ps_module:             { table: DeviceEvents }

    splunk:
        sigma_backend: splunk
        format: default
        baseline_pipelines: []
        label: "Splunk (SPL)"

    elasticsearch:
        sigma_backend: lucene
        format: default
        baseline_pipelines: [ecs_windows]
        label: "Elastic (Lucene DSL)"

    crowdstrike:
        sigma_backend: log_scale
        format: default
        baseline_pipelines: [crowdstrike_fdr]
        label: "CrowdStrike Falcon (LogScale)"

# Per-logsource pipeline additions. Baseline pipelines above + these combined
# in listed order (baseline first). First match wins; entries should be
# ordered most-specific first.
logsource_matrix:
    # Windows Sysmon-sourced observations. Splunk needs the Windows field-mapping
    # pipeline plus the Sysmon event-normalizer; Kusto/Elastic/CrowdStrike
    # backends handle these categories via their baseline pipelines.
    - match: { product: windows, category: process_creation }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: file_event }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: image_load }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: registry_set }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: network_connection }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: dns_query }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: pipe_created }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: create_remote_thread }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: raw_access_thread }
      backends:
          splunk: [splunk_windows, sysmon]
    - match: { product: windows, category: driver_load }
      backends:
          splunk: [splunk_windows, sysmon]
